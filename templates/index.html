
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TẤN TRÍ SKIN STORE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial}
header{text-align:center;padding:30px 15px;background:#1b1b29}
h1{color:#ff4545;margin:0}
main{max-width:1100px;margin:25px auto;padding:15px}
#skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:#20202d;border-radius:14px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover}
.info{padding:15px}
.info h3{margin:5px 0}
.hero{color:#ff7777;font-size:13px}
.download{display:block;text-align:center;background:#e52b35;color:white;padding:12px;border-radius:8px;text-decoration:none;margin-top:12px}
.empty{text-align:center;color:#aaa;padding:35px}
</style>
</head>
<body>
<header>
<h1>TẤN TRÍ SKIN STORE</h1>
<p>Kho hình ảnh và link tải skin</p>
</header>
<main>
<h2>Danh sách skin</h2>
<div id="skins">
{% for skin in skins %}
<div class="card">
<img src="{{ skin.image_url }}" alt="{{ skin.skin_name }}" loading="lazy">
<div class="info">
<div class="hero">{{ skin.hero }}</div>
<h3>{{ skin.skin_name }}</h3>
<a class="download" href="{{ skin.download_url }}" target="_blank" rel="noopener">TẢI SKIN</a>
</div>
</div>
{% else %}
<div class="empty">Chưa có skin nào. Hãy quay lại sau nhé!</div>
{% endfor %}
</div>
</main>
</body>
</html>
